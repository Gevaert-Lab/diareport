name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*' # Trigger whenever a tag starting with 'v' is pushed (v0.9.1, etc.)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN}}

      - name: Extract Metadata (Tagging)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: aarge/gevaertlab_diareport
          tags: |
            type=semver,pattern={{version}}
            # This ensures 'latest' is updated when you push a tag
            type=raw,value=latest

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # This passes the GitHub Tag (e.g. 0.9.1) into your Docker ARG automatically!
          build-args: |
            DIAREPORT_VERSION=${{ github.ref_name }}